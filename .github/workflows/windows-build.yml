name: Windows EXE
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install application, test and build dependencies first
        run: python -m pip install -r requirements.txt pyinstaller httpx
      - name: Check syntax
        run: python -m compileall -q app.py desktop.py tests
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build desktop EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name KhensozDownloader --add-data "static;static" --hidden-import uvicorn.logging --hidden-import uvicorn.loops.auto --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.lifespan.on desktop.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Windows-EXE
          path: dist/KhensozDownloader.exe
          if-no-files-found: error
